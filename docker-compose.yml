services:
  mysql8:
    container_name: mysql8
    image: mysql:8
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: msvc-usuarios
    volumes:
      - data-mysql:/var/lib/mysql
    networks:
      - spring
    restart: always

  postgres14:
    container_name: postgres14
    image: postgres:14-alpine
    ports:
      - "5532:5432"
    environment:
        POSTGRES_PASSWORD: root
        POSTGRES_DB: msvc-cursos
    volumes:
        - data-postgres:/var/lib/postgresql/data
    networks:
        - spring
    restart: always

  msvc-usuarios:
    container_name: msvc-usuarios
    image: ronaldvc14/usuarios:latest
#    build:
#      context: ./
#      dockerfile: ./msvc-usuarios/Dockerfile
#    image: usuarios:latest
    ports:
      - "8001:8001"
#    env_file:
#      - ./msvc-usuarios/.env
    environment:
      PORT: 8001
      DB_HOST: mysql8:3306
      DB_DATABASE: msvc-usuarios
      DB_USERNAME: root
      DB_PASSWORD: root
      CURSOS_URL: msvc-cursos:8002
    networks:
      - spring
    depends_on:
      - mysql8
    restart: always

  msvc-cursos:
    container_name: msvc-cursos
    image: ronaldvc14/cursos:latest
#    build:
#        context: ./
#        dockerfile: ./msvc-cursos/Dockerfile
#    image: cursos:latest
    ports:
      - "8002:8002"
#    env_file:
#      - ./msvc-cursos/.env
    environment:
      PORT: 8002
      DB_HOST: postgres14:5432
      DB_DATABASE: msvc-cursos
      DB_USERNAME: postgres
      DB_PASSWORD: root
      USUARIOS_URL: msvc-usuarios:8001
    networks:
      - spring
    depends_on:
      - postgres14
      - msvc-usuarios
    restart: always

volumes:
  data-mysql:
    name: "data-mysql"
  data-postgres:
    name: "data-postgres"

networks:
  spring:
    name: spring
    external: true